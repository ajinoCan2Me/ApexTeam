<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チーム分けツール</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}
textarea{
    width:100%;
    height:180px;
    margin-top:10px;
}
select{
    font-size:16px;
    margin-top:10px;
}
button{
    margin-top:15px;
    padding:8px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>チーム分けツール</h1>

<p>名前とレベルを入力してください（例：山田,3）</p>
<p>レベル：初心者=1　中級者=2　上級者=3</p>

<label>1チームの人数：</label>
<select id="teamSize">
    <option value="1">1人</option>
    <option value="2">2人</option>
    <option value="3" selected>3人</option>
</select>

<br>

<textarea id="input" placeholder="名前,レベル（1行1人）"></textarea>

<br>

<button onclick="generateTeams()">チーム分けを実行</button>

<h2>結果</h2>

<textarea id="output" readonly></textarea>

<script>
function generateTeams(){

    const input=document.getElementById("input").value.trim();

    if(input===""){
        alert("入力してください。");
        return;
    }

    // 入力データ
    const players=input.split("\n").map(line=>{
        const [name,level]=line.split(",").map(v=>v.trim());

        return{
            name:name,
            level:Number(level)
        };
    });

    // 入力チェック
    if(players.some(p=>!p.name || isNaN(p.level) || p.level<1 || p.level>3)){
        alert("名前,レベル（1～3）の形式で入力してください。");
        return;
    }

    const teamSize=parseInt(document.getElementById("teamSize").value);

    // チーム数を計算
    let teamCount=Math.floor(players.length/teamSize);

    if(teamCount===0){
        teamCount=1;
    }

    // 余りがある場合は最後のチームを追加
    if(players.length%teamSize!==0){
        teamCount++;
    }

    // レベル順（高→低）
    players.sort((a,b)=>b.level-a.level);

    const teams=Array.from({length:teamCount},()=>[]);
    const teamLevels=new Array(teamCount).fill(0);

    for(const player of players){

        // 入れられるチーム
        const candidates=[];

        for(let i=0;i<teamCount;i++){

            // 最後のチームは余り用
            if(i===teamCount-1){
                candidates.push(i);
            }
            else if(teams[i].length<teamSize){
                candidates.push(i);
            }

        }

        // 合計レベルが最小のチーム
        let minIndex=candidates[0];

        for(const i of candidates){
            if(teamLevels[i]<teamLevels[minIndex]){
                minIndex=i;
            }
        }

        teams[minIndex].push(player);
        teamLevels[minIndex]+=player.level;
    }

    // 出力
    let result="";

    teams.forEach((team,index)=>{

        const totalLevel=team.reduce((sum,p)=>sum+p.level,0);

        result+=`チーム${index+1}（${team.length}人・合計レベル:${totalLevel}）\n`;

        team.forEach(player=>{
            result+=`${player.name},${player.level}\n`;
        });

        result+="\n";
    });

    document.getElementById("output").value=result;
}
</script>

</body>
</html>
